name: Hansard ingest

on:
  schedule:
    # Daily 00:00 GMT+8 == 16:00 UTC (cron is UTC). Hansard data is published
    # next-day, and the ingest lookback window keeps daily runs cheap.
    - cron: "0 16 * * *"
  workflow_dispatch: {}

concurrency:
  group: sg-hansard
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python ingest.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEBUG: "false"
          SAVE_JSON: "false"
          # Cap the rolling window at the most recent 21 days so a long recess
          # or an upstream outage can't balloon the run into hundreds of days.
          MAX_DAYS_PER_RUN: "21"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_ENABLED: "true"
          AI_PROVIDER: "openai"
          OPENAI_MODEL: "gpt-4o-mini"