name: Hansard ingest

on:
  schedule:
    # Daily 00:00 GMT+8 == 16:00 UTC (cron is UTC). Hansard data is published
    # next-day, and the ingest lookback window keeps daily runs cheap.
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Ingest one sitting date only (YYYY-MM-DD). Leave empty for the normal rolling window."
        required: false
        default: ""

concurrency:
  group: sg-hansard
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python ingest.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Recorded on each hansard_ingest_runs row so a run can be traced
          # back to the code that produced it.
          GIT_SHA: ${{ github.sha }}
          # Manual single-date re-ingest (e.g. a sitting that fell out of the
          # lookback window after a failed run). Empty on scheduled runs.
          RUN_DATE: ${{ inputs.run_date }}
          DEBUG: "false"
          SAVE_JSON: "false"
          # Cap the rolling window at the most recent 21 days so a long recess
          # or an upstream outage can't balloon the run into hundreds of days.
          MAX_DAYS_PER_RUN: "21"
          # Red job when a run is a total upstream blackout: every scanned day
          # empty *and* a date already in the database also reported empty.
          # Turned on after the GET->POST retirement went unnoticed for three
          # weeks of green ticks; the control probe makes this specific enough
          # that an ordinary recess or transient outage won't trip it.
          ALERT_ON_TOTAL_BLACKOUT: "true"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_ENABLED: "true"
          AI_PROVIDER: "openai"
          OPENAI_MODEL: "gpt-4o-mini"